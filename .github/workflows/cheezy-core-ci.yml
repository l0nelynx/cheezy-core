name: Cheezy Core CI

on:
  push:
    branches: [cheezy-wap]
  pull_request:
    branches: [cheezy-wap]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify module identity
        run: test "$(sed -n '1p' go.mod)" = "module github.com/metacubex/mihomo"
      - name: Test
        run: go test ./...
      - name: Test power save
        run: go test -tags with_powersave ./component/powersave ./component/resolver ./adapter/provider ./adapter/outbound ./transport/tuic/... ./dns ./tunnel/... ./log ./hub/route
      - name: Test power-save concurrency
        run: go test -race -tags with_powersave ./component/powersave ./adapter/provider ./adapter/outbound ./transport/tuic/... ./dns ./tunnel/statistic ./log ./hub/route
      - name: Build power save with gVisor
        run: go build -tags with_gvisor,with_powersave ./...

